<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#14351f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Monkey Business">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Monkey Business</title>
    <link rel="stylesheet" href="app.css?v=9">
</head>
<body>
    <div class="mb-app">
        <div class="mb-bg-shine mb-bg-shine-one"></div>
        <div class="mb-bg-shine mb-bg-shine-two"></div>

        <header class="mb-topbar">
            <div class="mb-title-row">
                <div class="mb-app-icon" aria-hidden="true">🐒</div>
                <div class="mb-title-copy">
                    <div class="mb-game-title">Monkey Business</div>
                    <div id="dictionary-status" class="mb-status">Dictionary ready</div>
                </div>
                <button id="reset-button" class="mb-round-button" title="Reset saved game" aria-label="Reset game">↻</button>
            </div>

            <section class="mb-wallet" aria-label="Game stats">
                <div class="mb-wallet-pill mb-wallet-main">
                    <span aria-hidden="true">🍌</span>
                    <strong id="bananas">0</strong>
                </div>
                <div class="mb-wallet-pill">
                    <span aria-hidden="true">⌨️</span>
                    <strong id="letters">0</strong>
                </div>
                <div class="mb-wallet-pill">
                    <span aria-hidden="true">📖</span>
                    <strong id="words">0</strong>
                </div>
                <div class="mb-wallet-pill">
                    <span aria-hidden="true">🐵</span>
                    <strong id="monkeys">0</strong>
                </div>
            </section>
        </header>

        <main class="mb-gameplay">
            <section class="mb-office-card" aria-label="Monkey office">
                <div class="mb-office-header">
                    <div>
                        <span class="mb-level-label">Floor 1</span>
                        <h1>Typing Office</h1>
                    </div>
                    <span id="monkey-office-summary" class="mb-office-count">No monkeys</span>
                </div>

                <div class="mb-office-scene">
                    <div class="mb-wall">
                        <div class="mb-window mb-window-left"></div>
                        <div class="mb-window mb-window-right"></div>
                        <div class="mb-sign mb-sign-left">TOP<br>TYPISTS</div>
                        <div class="mb-sign mb-sign-right">BANANA<br>HQ</div>
                    </div>

                    <div class="mb-lamp"></div>
                    <div class="mb-plant mb-plant-left"></div>
                    <div class="mb-plant mb-plant-right"></div>

                    <div id="floating-rewards-layer" class="floating-rewards-layer" aria-hidden="true"></div>

                    <div id="monkey-office-grid" class="monkey-office-grid">
                        <div class="office-empty-state">
                            <div class="empty-circle" aria-hidden="true">🐒</div>
                            <strong>Empty office</strong>
                            <span>Hire monkeys to start typing.</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="mb-tape-card" aria-label="Letter tape">
                <div class="mb-section-label">
                    <span>Letter Tape</span>
                    <i aria-hidden="true"></i>
                </div>
                <div id="output-area" class="output-area" aria-live="polite">
                    <span class="placeholder">Tap TYPE to begin...</span>
                </div>
            </section>

            <section class="mb-words-card" aria-label="Recent words">
                <div class="mb-section-label">
                    <span>Recent Words</span>
                </div>
                <div id="recent-words-list" class="recent-words-list">
                    <span class="empty-state">No words yet.</span>
                </div>
            </section>
        </main>

        <footer class="mb-dock" aria-label="Controls">
            <button id="buy-monkey-button" class="mb-dock-button mb-hire-button">
                <span class="mb-dock-icon" aria-hidden="true">🐒</span>
                <span>
                    <strong>Hire</strong>
                    <small><span id="monkey-cost">50</span> 🍌</small>
                </span>
            </button>

            <button id="type-button" class="mb-type-button">
                <span class="mb-type-icon" aria-hidden="true">⌨️</span>
                <span>
                    <strong>TYPE</strong>
                    <small>Random Letter</small>
                </span>
            </button>

            <div class="mb-dock-button mb-locked-button">
                <span class="mb-dock-icon" aria-hidden="true">⚡</span>
                <span>
                    <strong>Boosts</strong>
                    <small>Soon</small>
                </span>
            </div>

            <span id="monkey-cost-inline" class="visually-hidden">50</span>
        </footer>
    </div>

    <script src="words.js?v=9"></script>
    <script src="script.js?v=9"></script>
</body>
</html>
