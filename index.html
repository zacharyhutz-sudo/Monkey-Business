<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Monkey Business</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="phone-app">
        <div class="app-glow app-glow-one"></div>
        <div class="app-glow app-glow-two"></div>

        <header class="app-header" aria-label="Game header">
            <div class="title-row">
                <div class="app-icon" aria-hidden="true">
                    <span>🐒</span>
                </div>
                <div class="title-stack">
                    <span class="game-title">Monkey Business</span>
                    <span id="dictionary-status" class="dictionary-status">Loading dictionary...</span>
                </div>
                <button id="reset-button" class="icon-button" title="Reset saved game" aria-label="Reset game">
                    ↻
                </button>
            </div>

            <section class="resource-bar" aria-label="Game stats">
                <div class="resource-pill banana-pill">
                    <span class="resource-icon" aria-hidden="true">🍌</span>
                    <span id="bananas" class="resource-value">0</span>
                </div>
                <div class="resource-pill">
                    <span class="resource-icon" aria-hidden="true">⌨️</span>
                    <span id="letters" class="resource-value">0</span>
                </div>
                <div class="resource-pill">
                    <span class="resource-icon" aria-hidden="true">📖</span>
                    <span id="words" class="resource-value">0</span>
                </div>
                <div class="resource-pill">
                    <span class="resource-icon" aria-hidden="true">🐵</span>
                    <span id="monkeys" class="resource-value">0</span>
                </div>
            </section>
        </header>

        <main class="play-screen">
            <section class="office-card" aria-label="Monkey office">
                <div class="scene-topper">
                    <div>
                        <span class="scene-kicker">Floor 1</span>
                        <h1>Typing Office</h1>
                    </div>
                    <span id="monkey-office-summary" class="office-summary">No monkeys</span>
                </div>

                <div class="office-scene">
                    <div class="back-wall">
                        <div class="window window-left"></div>
                        <div class="window window-right"></div>
                        <div class="poster poster-one">TOP<br>MONKEY</div>
                        <div class="poster poster-two">BANANA<br>HQ</div>
                        <div class="shelf shelf-one"></div>
                        <div class="shelf shelf-two"></div>
                    </div>

                    <div class="lamp"></div>
                    <div class="plant plant-left"></div>
                    <div class="plant plant-right"></div>
                    <div id="floating-rewards-layer" class="floating-rewards-layer" aria-hidden="true"></div>

                    <div id="monkey-office-grid" class="monkey-office-grid">
                        <div class="office-empty-state">
                            <div class="empty-circle" aria-hidden="true">🐒</div>
                            <strong>Empty office</strong>
                            <span>Hire monkeys to start the typing machine.</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="letter-console" aria-label="Typewriter feed">
                <div class="console-label">
                    <span>LIVE LETTER TAPE</span>
                    <span class="console-light" aria-hidden="true"></span>
                </div>
                <div id="output-area" class="output-area" aria-live="polite">
                    <span class="placeholder">Tap TYPE to begin...</span>
                </div>
            </section>

            <section class="word-strip" aria-label="Recent words">
                <div class="word-strip-title">Recent Words</div>
                <div id="recent-words-list" class="recent-words-list">
                    <span class="empty-state">No words yet.</span>
                </div>
            </section>
        </main>

        <footer class="control-dock" aria-label="Game controls">
            <button id="buy-monkey-button" class="hire-button">
                <span class="button-icon" aria-hidden="true">🐒</span>
                <span class="button-copy">
                    <strong>Hire</strong>
                    <small><span id="monkey-cost">50</span> 🍌</small>
                </span>
            </button>

            <button id="type-button" class="type-button">
                <span class="type-button-icon" aria-hidden="true">⌨️</span>
                <span class="type-button-copy">
                    <strong>TYPE</strong>
                    <small>Random Letter</small>
                </span>
            </button>

            <div class="mini-upgrade-card" aria-label="Next upgrade preview">
                <span class="button-icon" aria-hidden="true">⚡</span>
                <span class="button-copy">
                    <strong>Boosts</strong>
                    <small>Soon</small>
                </span>
            </div>
            <span id="monkey-cost-inline" class="visually-hidden">50</span>
        </footer>
    </div>

    <script src="words.js"></script>
    <script src="script.js"></script>
</body>
</html>
