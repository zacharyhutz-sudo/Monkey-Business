<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Business</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Monkey Business</h1>
            <p class="subtitle">Build a ridiculous primate-powered word empire.</p>
        </header>

        <section class="stats">
            <div class="stat">Bananas: <span id="bananas">0</span></div>
            <div class="stat">Letters Typed: <span id="letters">0</span></div>
            <div class="stat">Words Typed: <span id="words">0</span></div>
        </section>

        <main>
            <div id="output-area" class="output-area">
                <span class="placeholder">Click "Type" to begin...</span>
            </div>
            
            <button id="type-button" class="type-btn">Type</button>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
